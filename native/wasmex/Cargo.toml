[package]
name = "wasmex"
version = "0.14.0"
authors = ["Philipp Tessenow <philipp@tessenow.org>"]
description = "Elixir extension to run WebAssembly binaries through wasmtime"
readme = "README.md"
repository = "https://github.com/tessi/wasmex"
keywords = ["elixir", "extension", "webassembly", "wasmtime"]
categories = ["wasm"]
edition = "2021"

[lib]
name = "wasmex"
path = "src/lib.rs"
crate-type = ["dylib"]

[dependencies]
bytes = "1.12"
rand = "0.9.1"
rustler = { version = "0.37.2", features = ["big_integer", "serde"] }
tokio = { version = "1.48", features = ["full"] }
wasmtime = { version = "48.0.7", default-features = false, features = [
    "addr2line",
    "async",
    "backtrace",
    "component-model",
    "cranelift",
    "debug-builtins",
    "demangle",
    "gc",
    "gc-copying",
    "parallel-compilation",
    "runtime",
    "std",
    "threads",
    "wat",
] }
wasmtime-wasi = "48.0.7"
wasmtime-wasi-http = "48.0.7"
wat = "1.243.0"
wit-parser = "0.243.0"
